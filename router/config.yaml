# ai-tools router configuration
#
# This file maps model names (as they appear in the `model` field of an
# incoming /v1/messages or /v1/chat/completions request) to backend URLs.
#
# Override the path to this file with:
#   --config /path/to/config.yaml   (CLI flag)
#   ROUTER_CONFIG=/path/to/config.yaml  (env var)
#
# Defaults:
#   host: 0.0.0.0
#   port: 8090

# Bind address for the router.
host: 0.0.0.0
port: 8090

# Seconds to wait for the backend to produce the first byte. Long-running
# generations stream, so this only bounds the connect + first-token time.
request_timeout_s: 120

# How many bytes to read from the backend at a time while streaming.
read_chunk_size: 4096

# Model name -> backend URL.
# The URL is the base of a llama.cpp server (host and port only); the router
# appends the request path (/v1/messages or /v1/chat/completions) verbatim.
# Replace each <server_url> with the address of your backend, e.g.
#   "http://localhost:8080"
# or
#   "http://192.168.1.20:8080"
models:
  # Example: a larger model for decomposition / synthesis.
  orchestrator: "<server_url>"
  # Example: a smaller, faster model for executing individual subtasks.
  worker: "<server_url>"

# Optional: if a request's model name doesn't match any entry above,
# fall back to this model. Set to null (or omit) to return 404 on unknown
# models instead.
default_model: orchestrator
